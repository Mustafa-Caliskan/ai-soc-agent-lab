<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTech - Premium Analiz Paneli</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151921;
            --accent: #3498db;
            --danger: #e74c3c;
            --text: #e0e6ed;
            --muted: #64748b;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 750px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .header {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
            margin-bottom: 30px;
            text-align: left;
        }
        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
            color: var(--accent);
        }
        .header p {
            margin: 5px 0 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }
        .input-group { margin-bottom: 25px; }
        label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
        }
        textarea {
            width: 100%;
            height: 110px;
            background: #1c222d;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: white;
            padding: 15px;
            font-size: 1.4rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: var(--accent); }
        .result-box {
            background: rgba(52, 152, 219, 0.05);
            border: 1px solid rgba(52, 152, 219, 0.2);
            border-radius: 8px;
            padding: 25px;
            min-height: 100px;
        }
        .result-label {
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 800;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .result-label::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px var(--accent);
        }
        #result {
            font-size: 1.5rem;
            line-height: 1.5;
            font-weight: 500;
            color: white;
            word-wrap: break-word;
        }
        .placeholder { color: #3d4a5f; font-style: italic; font-weight: 400; }
    </style>
</head>
<body>

<div class="panel">
    <div class="header">
        <h1>ADLİ ANALİZ PANELİ</h1>
        <p>Gizli Unicode Veri Çözümleme ve Güvenlik Denetimi</p>
    </div>

    <div class="input-group">
        <label>Veri Girişi (Emoji/Metin)</label>
        <textarea id="input" oninput="liveDecode()" placeholder="Analiz edilecek emojiyi buraya bırakın..."></textarea>
    </div>

    <div class="result-box">
        <div class="result-label">TESPİT EDİLEN GİZLİ KOMUT</div>
        <div id="result"><span class="placeholder">Veri bekleniyor...</span></div>
    </div>
</div>

<script>
    function liveDecode() {
        const text = document.getElementById('input').value;
        const resultDiv = document.getElementById('result');
        
        let decoded = "";
        for (let i = 0; i < text.length; i++) {
            const code = text.codePointAt(i);
            if (code > 0xFFFF) i++; 
            if (code >= 0xE0000 && code <= 0xE007F) {
                decoded += String.fromCodePoint(code - 0xE0000);
            }
        }

        if (decoded) {
            resultDiv.innerText = decoded;
            resultDiv.classList.remove('placeholder');
        } else {
            resultDiv.innerHTML = '<span class="placeholder">Herhangi bir gizli talimat tespit edilmedi.</span>';
        }
    }
</script>

</body>
</html>
